 "foto": ""}, {"id": "d15", "nombre": "", "rol": "Co-vocería", "comision": "C3", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}, {"id": "d16", "nombre": "", "rol": "Integrante", "comision": "C3", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}, {"id": "d17", "nombre": "", "rol": "Integrante", "comision": "C3", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}, {"id": "d18", "nombre": "", "rol": "Integrante", "comision": "C3", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}, {"id": "d19", "nombre": "", "rol": "Presidencia de comisión", "comision": "C4", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}, {"id": "d20", "nombre": "", "rol": "Vocería", "comision": "C4", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}, {"id": "d21", "nombre": "", "rol": "Co-vocería", "comision": "C4", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}, {"id": "d22", "nombre": "", "rol": "Integrante", "comision": "C4", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}, {"id": "d23", "nombre": "", "rol": "Integrante", "comision": "C4", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}, {"id": "d24", "nombre": "", "rol": "Integrante", "comision": "C4", "localidad": "", "institucion": "", "correo": "", "bio": "", "foto": ""}]}, "proyectos": [{"id": "p1", "titulo": "Sistema Distrital de Cabildantes", "comision": "C3", "etapa": 1, "tipo": "Proyecto de acuerdo", "resumen": "Darle a la figura del cabildante una estructura estable en todo el Distrito: elección, formación, acompañamiento y rendición de cuentas."}, {"id": "p2", "titulo": "Salud mental en los colegios", "comision": "C3", "etapa": 2, "tipo": "Proyecto de acuerdo", "resumen": "Construido a partir de lo encontrado en la Proposición 641 y abierto a la coautoría de concejales de todas las bancadas."}, {"id": "p3", "titulo": "Seguimiento a la Proposición 641", "comision": "C1", "etapa": 4, "tipo": "Control político", "resumen": "Revisamos las respuestas de las 9 entidades citadas con un semáforo de calidad y preparamos insistencias donde fueron parciales o evasivas."}, {"id": "p4", "titulo": "Escuela de Veedores Estudiantiles", "comision": "C2", "etapa": 0, "tipo": "Propuesta", "resumen": "Formar a estudiantes en control social de la mano de la Veeduría Distrital, para vigilar los programas que llegan a sus colegios."}, {"id": "p5", "titulo": "MUN-MDCE", "comision": "C4", "etapa": 4, "tipo": "Formación", "resumen": "Modelo de debate de la Mesa para entrenar a los cabildantes en argumentación, negociación y redacción de propuestas."}, {"id": "p6", "titulo": "Ruta hacia el primer empleo", "comision": "C4", "etapa": 0, "tipo": "Propuesta", "resumen": "Una feria y una ruta de orientación para estudiantes de grado 10.º y 11.º sobre formación para el trabajo y primer empleo."}], "ruta": [{"t": "Convocatoria", "d": "Tu colegio abre la convocatoria para elegir cabildante estudiantil, junto con el proceso de gobierno escolar.", "cuando": "Inicio del año escolar"}, {"t": "Inscripción", "d": "Pueden postularse estudiantes de grado 6.º a 11.º (Acuerdo 597 de 2015). Llega con una propuesta concreta para tu colegio y tu localidad.", "cuando": "Según el calendario del colegio"}, {"t": "Campaña", "d": "Presenta tus propuestas en los salones y escucha a tus compañeros. Una buena campaña pregunta más de lo que promete.", "cuando": "Dos a tres semanas"}, {"t": "Elección", "d": "Los estudiantes votan. El colegio levanta el acta y reporta a quien resulte elegido.", "cuando": "Jornada electoral escolar"}, {"t": "Posesión", "d": "Los cabildantes elegidos se posesionan y reciben su acreditación.", "cuando": "Después de la elección"}, {"t": "Mesa local", "d": "Los cabildantes de cada localidad se reúnen en la Mesa Estudiantil Local y eligen a quienes los representan en la Mesa Distrital.", "cuando": "Primer semestre"}, {"t": "Mesa Distrital", "d": "Instalación de la Mesa, elección de la mesa directiva y conformación de las cuatro comisiones.", "cuando": "Primer semestre"}, {"t": "Día del Cabildante", "d": "Sesión plenaria en el Concejo de Bogotá el último viernes de mayo, como lo establece el Acuerdo 597 de 2015.", "cuando": "Último viernes de mayo"}], "comunicados": [{"id": "c5", "fecha": "2026-10-01", "autor": "Presidencia", "tipo": "Comunicado", "titulo": "Bienvenidos a nuestra casa digital", "cuerpo": "Durante años, lo que hacíamos en la Mesa quedaba repartido en chats, carpetas y fotos que solo veíamos nosotros. Hoy eso cambia. Esta página es para que cualquier estudiante de Bogotá sepa quién lo representa, qué estamos haciendo y cómo puede hacerse escuchar.\n\nAquí van a encontrar el buzón de iniciativas, el directorio, nuestra agenda y una sala de prensa. También abrimos la red: si eres concejal, funcionario, parte de una organización o periodista, queremos trabajar contigo.\n\nY se viene algo más: un podcast para contar con calma lo que en el recinto se dice en tres minutos. Esta casa es de todos los cabildantes. Bienvenidos.", "firma": "Isabella Hermosa Osma\nPresidenta de la Mesa Distrital de Cabildantes Estudiantiles"}, {"id": "c1", "fecha": "2026-09-28", "autor": "Presidencia", "tipo": "Convocatoria", "titulo": "Nos vemos el 1 de octubre en el Concejo", "cuerpo": "Querida Mesa: el 1 de octubre volvemos a encontrarnos en el recinto del Concejo de Bogotá. Cada comisión nos va a contar cómo le fue este año: lo que se propuso, lo que logró, lo que le respondieron las entidades y también lo que no salió, porque eso también se cuenta.\n\nLleguen puntuales, con su credencial y con ganas de escuchar. Las familias, los docentes y nuestros aliados están invitados a acompañarnos.", "firma": "Isabella Hermosa Osma\nPresidenta de la Mesa Distrital de Cabildantes Estudiantiles"}, {"id": "c2", "fecha": "2026-09-15", "autor": "Presidencia", "tipo": "Comunicado", "titulo": "Ya tenemos cara: el Sol de 20 localidades", "cuerpo": "Ustedes votaron y ganó el Sol de 20 localidades, con 12 votos. El Megáfono, con 8, fue una propuesta que nos hizo pensar mucho; gracias a quienes la defendieron.\n\nMe gusta lo que dice este escudo: veinte rayos distintos que salen del mismo centro. Así somos. Venimos de colegios, barrios y realidades muy diferentes, pero cuando nos sentamos juntos somos una sola mesa.\n\nLos logotipos oficiales ya están en la sala de prensa. Úsenlos con orgullo y con cuidado: no los deformen ni les cambien los colores.", "firma": "Isabella Hermosa Osma\nPresidenta de la Mesa Distrital de Cabildantes Estudiantiles"}, {"id": "c3", "fecha": "2026-09-10", "autor": "Secretaría General", "tipo": "Circular", "titulo": "Informes de comisión: plazo hasta el 28 de septiembre", "cuerpo": "Las comisiones de Control Político, Control Social, Gestión Normativa y Participación Incidente entregan su informe de gestión a la Secretaría General a más tardar el 28 de septiembre de 2026.\n\nDos reglas para que el informe sirva: cada cifra debe poder rastrearse hasta un registro concreto, y ningún dato personal de un menor de edad debe aparecer en el documento. Si tienen dudas, escríbanle a la Secretaría.", "firma": "Joel Páez\nSecretario General"}, {"id": "c4", "fecha": "2026-08-01", "autor": "Presidencia", "tipo": "Comunicado", "titulo": "Lo que dijimos el 30 de julio no se queda en el recinto", "cuerpo": "El 30 de julio nos sentamos frente a nueve entidades del Distrito con 26 preguntas sobre la salud mental y el bienestar de los estudiantes. Cada una de esas preguntas la escribió alguien de esta Mesa. Gracias.\n\nAhora viene la parte que no sale en las fotos: leer cada respuesta, calificarla con honestidad y volver a preguntar donde nos respondieron a medias. Un debate de control político no termina cuando se apagan los micrófonos. Termina cuando las cosas cambian en los colegios.", "firma": "Isabella Hermosa Osma\nPresidenta de la Mesa Distrital de Cabildantes Estudiantiles"}], "agenda": [{"id": "e1", "fecha": "2026-10-01", "hora": "", "tipo": "sesion", "titulo": "Plenaria de la Mesa Distrital", "lugar": "Concejo de Bogotá", "estado": "Confirmada", "desc": "Encuentro de la Mesa en el Concejo de Bogotá: balance de las cuatro comisiones, formación, alianzas y hoja de ruta 2027.", "soloMes": false}, {"id": "e2", "fecha": "2026-10-15", "hora": "", "tipo": "capacitacion", "titulo": "Capacitaciones virtuales por comisión", "lugar": "Virtual", "estado": "Fecha por confirmar", "desc": "Una jornada virtual para cada comisión: herramientas de control político, control social, gestión normativa y participación.", "soloMes": true}, {"id": "e3", "fecha": "2026-11-15", "hora": "", "tipo": "evento", "titulo": "La Mesa vuelve a las localidades", "lugar": "Las 20 localidades", "estado": "Fecha por confirmar", "desc": "Cada Mesa Estudiantil Local recibe el balance del año, como lo prevé el Acuerdo 597 de 2015. Es la oportunidad de contarle a cada colegio lo que se hizo con su voz.", "soloMes": true}, {"id": "e4", "fecha": "2027-05-28", "hora": "", "tipo": "sesion", "titulo": "Día del Cabildante Estudiantil", "lugar": "Concejo de Bogotá", "estado": "Por Acuerdo 597", "desc": "Cada último viernes de mayo el Concejo de Bogotá abre su recinto a los cabildantes en una sesión plenaria. Es nuestro día.", "soloMes": false}, {"id": "e5", "fecha": "2026-09-28", "hora": "", "tipo": "plazo", "titulo": "Entrega de informes de comisión", "lugar": "Secretaría General", "estado": "Cumplido", "desc": "Cierre del plazo para que cada comisión entregue su informe a la Secretaría General.", "soloMes": false}, {"id": "e6", "fecha": "2026-07-30", "hora": "", "tipo": "sesion", "titulo": "Sesión de control político: Proposición 641", "lugar": "Concejo de Bogotá", "estado": "Realizada", "desc": "La Mesa presentó 26 preguntas en 7 ejes a 9 entidades citadas sobre salud mental y bienestar estudiantil.", "soloMes": false}, {"id": "e7", "fecha": "2026-07-14", "hora": "", "tipo": "sesion", "titulo": "Aprobación de la Proposición 641", "lugar": "Plenaria del Concejo", "estado": "Realizada", "desc": "La plenaria del Concejo aprobó la proposición que abrió el debate de control político de la Mesa.", "soloMes": false}], "noticias": [{"id": "n-web", "fecha": "2026-10-01", "categoria": "La Mesa", "destacada": true, "titulo": "La Mesa estrena casa digital", "resumen": "Buzón de iniciativas, directorio, sala de prensa, red de aliados y un asistente que responde tus preguntas: todo en un solo lugar.", "cuerpo": "La Mesa Distrital de Cabildantes Estudiantiles ya tiene página propia. Fue pensada para que cualquier estudiante de Bogotá encuentre en un par de clics quién lo representa, qué está haciendo la Mesa y cómo hacerle llegar una propuesta.\n\nEl buzón de iniciativas recibe propuestas, alertas y preguntas para las entidades, y le entrega a cada persona un número de radicado para hacer seguimiento. El directorio presenta a la mesa directiva y a las cuatro comisiones. La sala de prensa reúne los datos clave, el contacto y los logotipos oficiales.\n\nTambién abrimos un formulario para quienes quieran sumarse a nuestra red: concejales, funcionarios, organizaciones, academia y medios. Y estrenamos un asistente que responde preguntas sobre la Mesa a cualquier hora.", "imagen": "galeria:sesion-recinto", "ilustracion": "sol"}, {"id": "n-podcast", "fecha": "2026-10-01", "categoria": "Podcast", "destacada": true, "titulo": "Se viene el podcast de la Mesa", "resumen": "Conversaciones con cabildantes, concejales y expertos sobre lo que pasa en los colegios de Bogotá. Ya estamos buscando temas e invitados.", "cuerpo": "La Mesa prepara su propio podcast: un espacio para contar con calma lo que en una sesión del Concejo se dice en tres minutos. Habrá cabildantes de las 20 localidades, invitados del Concejo y de las entidades, y voces expertas en salud mental, educación, seguridad y futuro laboral.\n\nEl nombre y la fecha de estreno están por confirmar. Mientras tanto, queremos escucharte: ¿de qué tema debería hablar el primer episodio? ¿A quién te gustaría oír? Escríbenos por el buzón de iniciativas o súmate a la red si quieres participar como invitado o como medio aliado.", "imagen": "galeria:sesion-lectura", "ilustracion": "megafono"}, {"id": "n-cartas", "fecha": "2026-09-20", "categoria": "Alianzas", "destacada": true, "titulo": "Más de 20 alianzas en camino", "resumen": "La Presidencia firmó 25 cartas para tejer una red con organismos de control, academia, organizaciones internacionales y medios.", "cuerpo": "Una mesa que quiere incidir no puede trabajar sola. Por eso la Presidencia firmó 25 cartas dirigidas a instituciones que pueden fortalecer el trabajo de la Mesa: la Veeduría Distrital, la Mesa Directiva del Concejo, la Secretaría de Educación, consultorios jurídicos, organizaciones internacionales, redes de participación juvenil y medios de comunicación.\n\nCada carta propone algo concreto: formación para veedores estudiantiles, espacios de seguimiento en el Concejo, apoyo técnico para los proyectos de acuerdo, o formatos para contar en los medios lo que pasa en los colegios. Hoy son más de 20 las alianzas en gestión.\n\nSi tu organización quiere sumarse, el formulario de la red está abierto.", "imagen": "galeria:sesion-conversacion", "ilustracion": "buzon"}, {"id": "n-identidad", "fecha": "2026-09-15", "categoria": "Identidad", "destacada": true, "titulo": "Veinte rayos, una sola mesa: así nació nuestra identidad", "resumen": "Los cabildantes eligieron por votación el Sol de 20 localidades. Ya están disponibles los logotipos oficiales.", "cuerpo": "La identidad de la Mesa no la escogió una agencia: la votaron los cabildantes. La propuesta Sol de 20 localidades obtuvo 12 votos y se impuso a El Megáfono, que obtuvo 8.\n\nEl escudo tiene una idea sencilla: veinte rayos, uno por cada localidad, que nacen de una misma estrella, la Mesa. El lema lo dice en cinco palabras: Veinte localidades, una sola mesa. El azul cabildo y el oro son sus colores, y cada comisión tiene su propio tono de azul.\n\nYa están listos los logotipos oficiales en versiones horizontal, vertical, firma con lema, escudo y escudos por comisión, en formatos SVG y PNG. Están en la sala de prensa, con su guía de uso.", "imagen": "galeria:identidad-logos", "ilustracion": "sol"}, {"id": "n-proyectos", "fecha": "2026-09-30", "categoria": "Gestión normativa", "destacada": false, "titulo": "Cinco proyectos de acuerdo toman forma", "resumen": "Desde un Sistema Distrital de Cabildantes hasta la salud mental en los colegios: las propuestas que la Mesa quiere llevar al Concejo.", "cuerpo": "La Comisión de Gestión Normativa trabaja en más de cinco proyectos de acuerdo. Entre ellos están el Sistema Distrital de Cabildantes, que busca darle a la figura una estructura estable en todo el Distrito, y un proyecto sobre salud mental en los colegios construido a partir de lo encontrado en la Proposición 641.\n\nCada propuesta pasa por un banco de iniciativas, una revisión técnica y jurídica, y una conversación con concejales de distintas bancadas antes de radicarse. Las que están abiertas reciben aportes por el buzón.", "imagen": "galeria:intervencion-atril-2", "ilustracion": "libro"}, {"id": "n-plenaria", "fecha": "2026-09-29", "categoria": "Plenarias", "destacada": false, "titulo": "Plenaria de octubre: las comisiones hacen balance", "resumen": "El 1 de octubre las cuatro comisiones cuentan qué hicieron, qué obtuvieron y qué queda pendiente para 2027.", "cuerpo": "La plenaria del 1 de octubre reúne a la Mesa en el Concejo de Bogotá. Cada comisión presenta su balance del año: los temas que priorizó, las respuestas que obtuvo de las entidades y los pendientes que le entrega a la mesa entrante.\n\nEn la agenda también están la formación, las alianzas y la hoja de ruta de 2027.", "imagen": "galeria:plenaria-recinto", "ilustracion": "capitolio"}, {"id": "n-641", "fecha": "2026-07-31", "categoria": "Control político", "destacada": false, "titulo": "26 preguntas y 9 entidades: así fue el 30 de julio", "resumen": "La Mesa llevó al Concejo su cuestionario sobre salud mental y bienestar de los estudiantes.", "cuerpo": "El 30 de julio, en el recinto del Concejo de Bogotá, la Mesa presentó un cuestionario de 26 preguntas en 7 ejes a nueve entidades citadas: la Secretaría de Salud, las cuatro Subredes, Integración Social, la Secretaría de la Mujer, la Secretaría de Educación e IDIPRON. La Personería, la Contraloría y la Veeduría fueron invitadas.\n\nAhora sigue lo menos visible y lo más importante: leer cada respuesta, calificarla y volver a preguntar donde no hubo una respuesta de fondo.", "imagen": "galeria:sesion-curules", "ilustracion": "megafono"}, {"id": "n-proposicion", "fecha": "2026-07-15", "categoria": "Control político", "destacada": false, "titulo": "El Concejo aprobó la Proposición 641", "resumen": "La plenaria del Concejo aprobó el 14 de julio la proposición que abrió el debate de control político de la Mesa.", "cuerpo": "Con la aprobación de la Proposición 641 de 2026, el Concejo de Bogotá abrió la puerta para que la Mesa citara a las entidades responsables de la salud mental y el bienestar de los estudiantes.\n\nFue el punto de partida de la sesión del 30 de julio.", "imagen": "galeria:intervencion-atril", "ilustracion": "libro"}], "transparencia": {"indicadores": [{"label": "Sesiones plenarias en 2026", "valor": "3", "nota": "Por confirmar"}, {"label": "Sesiones de comisión", "valor": "9", "nota": "Por confirmar"}, {"label": "Preguntas formuladas (Proposición 641)", "valor": "26", "nota": ""}, {"label": "Entidades citadas", "valor": "9", "nota": ""}, {"label": "Organismos de control invitados", "valor": "3", "nota": ""}], "semaforo": {"verde": null, "amarillo": null, "naranja": null, "rojo": null}, "documentos": [{"titulo": "Acuerdo 597 de 2015", "tipo": "Norma", "fecha": "2015-08-21", "estado": "Publicado", "url": "https://www.alcaldiabogota.gov.co/sisjur/norma a evasiva también dice algo. Este año aprendimos a leer las dos."}, {"id": "v3", "tipo": "Crónica", "titulo": "Mi colegio en el recinto", "autor": "Cabildante", "localidad": "", "ejemplo": true, "texto": "Llegué al Concejo con una carpeta y miedo de hablar. Salí con tres compromisos por escrito y ganas de volver."}], "aliados": [{"nombre": "Concejo de Bogotá", "tipo": "Institucional", "estado": "Institucional", "url": "https://concejodebogota.gov.co"}, {"nombre": "Secretaría de Educación del Distrito", "tipo": "Institucional", "estado": "Institucional", "url": "https://www.educacionbogota.edu.co"}, {"nombre": "Veeduría Distrital", "tipo": "Control", "estado": "En conversación", "url": "https://www.veeduriadistrital.gov.co"}, {"nombre": "Personería de Bogotá", "tipo": "Control", "estado": "En conversación", "url": "https://www.personeriabogota.gov.co"}, {"nombre": "Contraloría de Bogotá", "tipo": "Control", "estado": "En conversación", "url": "https://www.contraloriabogota.gov.co"}, {"nombre": "IDPAC", "tipo": "Participación", "estado": "En conversación", "url": "https://www.participacionbogota.gov.co"}, {"nombre": "UNICEF Colombia", "tipo": "Internacional", "estado": "En conversación", "url": "https://www.unicef.org/colombia"}, {"nombre": "PNUD Colombia", "tipo": "Internacional", "estado": "En conversación", "url": "https://www.undp.org/es/colombia"}, {"nombre": "OEI", "tipo": "Internacional", "estado": "En conversación", "url": "https://oei.int"}, {"nombre": "Bogotá Cómo Vamos", "tipo": "Sociedad civil", "estado": "En conversación", "url": "https://bogotacomovamos.org"}, {"nombre": "Cámara de Comercio de Bogotá", "tipo": "Privado", "estado": "En conversación", "url": "https://www.ccb.org.co"}, {"nombre": "Canal Capital", "tipo": "Medios", "estado": "En conversación", "url": "https://www.canalcapital.gov.co"}], "faq": [{"q": "¿Quién puede ser cabildante estudiantil?", "a": "Estudiantes de grado 6.º a 11.º de los colegios de Bogotá, elegidos por sus compañeros según el Acuerdo 597 de 2015."}, {"q": "¿Qué diferencia hay entre cabildante y personero?", "a": "El personero promueve los derechos de los estudiantes dentro del colegio. El cabildante lleva la voz de su colegio y su localidad ante el Concejo de Bogotá."}, {"q": "¿Puedo enviar una propuesta si no soy cabildante?", "a": "Sí. El buzón de iniciativas está abierto a estudiantes, docentes, familias y ciudadanía. La comisión que corresponda la revisa."}, {"q": "¿Cómo sé qué pasó con mi iniciativa?", "a": "Al enviarla recibes un número de radicado. Con ese número puedes preguntar por su estado al correo de la Mesa."}, {"q": "¿La Mesa publica datos personales de menores?", "a": "No publicamos datos de contacto personales de menores de edad. Los contactos de este sitio son canales institucionales."}], "galeria": [{"id": "mesa-todos", "src": "assets/img/fotos/mesa-todos.jpg", "caption": "Cabildantes de la Mesa Distrital en el recinto del Concejo de Bogotá", "alt": "Cabildantes de la Mesa Distrital en el recinto del Concejo de Bogotá", "album": "Concejo", "w": 475, "h": 633}, {"id": "plenaria-aplausos", "src": "assets/img/fotos/plenaria-aplausos.jpg", "caption": "Cabildantes celebran en el recinto del Concejo de Bogotá", "alt": "Cabildantes celebran en el recinto del Concejo de Bogotá", "album": "Concejo", "w": 432, "h": 576}, {"id": "plenaria-recinto", "src": "assets/img/fotos/plenaria-recinto.jpg", "caption": "Plenaria de cabildantes en el recinto del Concejo de Bogotá", "alt": "Plenaria de cabildantes en el recinto del Concejo de Bogotá", "album": "Concejo", "w": 681, "h": 511}, {"id": "grupo-certificados", "src": "assets/img/fotos/grupo-certificados.jpg", "caption": "Cabildantes con el reconocimiento del Concejo de Bogotá", "alt": "Cabildantes con el reconocimiento del Concejo de Bogotá", "album": "Concejo", "w": 681, "h": 511}, {"id": "orden-civil", "src": "assets/img/fotos/orden-civil.jpg", "caption": "Resolución y banda de la Orden Civil al Mérito José Acevedo y Gómez", "alt uros", "src": "assets/logos/svg/MDCE-escudo-reducido-negativo.svg"}, {"id": "favicon", "nombre": "MDCE-favicon.svg", "uso": "Ícono de página web", "src": "assets/logos/svg/MDCE-favicon.svg"}, {"id": "comision-C1-control-politico", "nombre": "MDCE-comision-C1-control-politico.svg", "uso": "Escudo de la Comisión de Control Político", "src": "assets/logos/svg/MDCE-comision-C1-control-politico.svg"}, {"id": "comision-C2-control-social", "nombre": "MDCE-comision-C2-control-social.svg", "uso": "Escudo de la Comisión de Control Social", "src": "assets/logos/svg/MDCE-comision-C2-control-social.svg"}, {"id": "comision-C3-gestion-normativa", "nombre": "MDCE-comision-C3-gestion-normativa.svg", "uso": "Escudo de la Comisión de Gestión Normativa", "src": "assets/logos/svg/MDCE-comision-C3-gestion-normativa.svg"}, {"id": "comision-C4-participacion-incidente", "nombre": "MDCE-comision-C4-participacion-incidente.svg", "uso": "Escudo de la Comisión de Participación Incidente", "src": "assets/logos/svg/MDCE-comision-C4-participacion-incidente.svg"}], "kitZip": "assets/logos/MDCE-logotipos.zip"}, "unete": {"tipos": ["Cabildante o exintegrante de la Mesa", "Estudiante", "Concejal o equipo de concejal", "Edil o Junta Administradora Local", "Magistrado, juez o rama judicial", "Funcionario público", "Organismo de control", "Organización social o fundación", "Organización internacional", "Universidad o academia", "Medio de comunicación o periodista", "Empresa o caja de compensación", "Docente u orientador", "Madre, padre o acudiente", "Otro"], "intereses": ["Seguir a la Mesa en redes", "Recibir el boletín", "Proponer una alianza", "Invitar a la Mesa a un evento", "Participar en el podcast", "Entrevista o cubrimiento de prensa", "Apoyo técnico o jurídico", "Formación para cabildantes", "Voluntariado"]}, "podcast": {"titulo": "El podcast de la Mesa", "estado": "Próximamente", "nombre": "Nombre por confirmar", "texto": "Conversaciones con cabildantes de las 20 localidades, concejales, entidades y expertos sobre lo que pasa en los colegios de Bogotá: salud mental, seguridad, educación y futuro.", "episodios": [], "plataformas": []}, "legal": [{"id": "terminos", "titulo": "Términos y condiciones de uso", "resumen": "Las reglas para usar este sitio web y sus servicios.", "secciones": [{"t": "1. Quiénes somos", "p": "Este sitio web es administrado por la Mesa Distrital de Cabildantes Estudiantiles de Bogotá D.C. (MDCE), instancia de participación estudiantil creada por el Acuerdo 597 de 2015 del Concejo de Bogotá y modificada por el Acuerdo 882 de 2023. Correo de contacto: cabildantesdebogota@gmail.com.\n\nLa MDCE no es una entidad pública ni hace parte de la administración distrital. No expide actos administrativos ni resuelve trámites de las entidades del Distrito."}, {"t": "2. Aceptación", "p": "Al navegar o usar los servicios de este sitio (buzón de iniciativas, formulario de la red, boletín y asistente) aceptas estos términos, la Política de tratamiento de datos personales y la Política de cookies. Si no estás de acuerdo, te pedimos no usar los formularios."}, {"t": "3. Uso permitido", "p": "Puedes consultar, citar y compartir la información del sitio con fines informativos, educativos, periodísticos y de participación ciudadana, indicando la fuente. No está permitido:\n- Enviar información falsa, suplantar a otra persona o usar datos de terceros sin su autorización.\n- Publicar o enviar contenido ofensivo, discriminatorio, violento o que vulnere derechos de niñas, niños y adolescentes.\n- Intentar acceder sin autorización al panel de administración, a los servidores o a los datos de otras personas.\n- Usar el sitio o el asistente para enviar publicidad, cadenas o mensajes masivos."}, {"t": "4. Buzón de iniciativas y formularios", "p": "Las iniciativas, alertas y preguntas que envías llegan al correo oficial de la Mesa y se asignan a la comisión que corresponda. El número de radicado sirve para hacer seguimiento, pero no constituye un derecho de petición ante una entidad pública ni obliga a la Mesa a un plazo legal de respuesta.\n\nSi necesitas respuesta de una entidad del Distrito, presenta un derecho de petición directamente ante ella (Ley 1755 de 2015). El buzón no es un canal de emergencias: ante un riesgo para la vida o la integridad, llama a la Línea 123."}, {"t": "5. Asistente de inteligencia artificial", "p": "El asistente responde de forma automática con base en la información publicada en este sitio. Puede equivocarse, no reemplaza la orientación de una persona y no constituye asesoría jurídica, médica ni psicológica. Lee el aviso del asistente antes de usarlo."}, {"t": "6. Contenidos y enlaces", "p": "Procuramos que la información sea exacta y esté actualizada; las cifras marcadas como «en verificación» pueden cambiar. Los enlaces a normas y sitios de terceros se ofrecen como referencia: la MDCE no controla su contenido ni su disponibilidad."}, {"t": "7. Propiedad intelectual", "p": "Los textos, fotografías, logotipos y la identidad visual de la MDCE están protegidos por la Ley 23 de 1982 y la Decisión Andina 351 de 1993. Consulta la sección de derechos de autor y uso de marca."}, {"t": "8. Responsabilidad", "p": "La MDCE no responde por interrupciones del servicio, fallas técnicas de terceros (alojamiento, correo o proveedores de inteligencia artificial) ni por el uso que terceros hagan de la información pública del sitio."}, {"t": "9. Cambios y ley aplicable", "p": "Podemos actualizar estos términos; la versión vigente es la publicada en esta página con su fecha. Se rigen por las leyes de la República de Colombia, en especial la Ley 527 de 1999 sobre mensajes de datos y comercio electrónico."}], "actualizado": "2026-10-01"}, {"id": "privacidad", "titulo": "Política de tratamiento de datos personales", "resumen": "Cómo recogemos, usamos y protegemos tus datos, conforme a la Ley 1581 de 2012.", "secciones": [{"t": "1. Responsable del tratamiento", "p": "Mesa Distrital de Cabildantes Estudiantiles de Bogotá D.C. (MDCE). Domicilio: Bogotá D.C., Colombia. Correo para ejercer tus derechos: cabildantesdebogota@gmail.com."}, {"t": "2. Marco legal", "p": "Artículo 15 de la Constitución Política, Ley Estatutaria 1581 de 2012, Decreto 1377 de 2013 (compilado en el Decreto Único Reglamentario 1074 de 2015, capítulo 25) y demás normas que las modifiquen o complementen."}, {"t": "3. Datos que recogemos", "p": "- Buzón de iniciativas: nombre, correo, teléfono (opcional), localidad, colegio (opcional), tipo de remitente y el contenido de tu mensaje.\n- Formulario de la red: nombre, correo, teléfono (opcional), tipo de perfil, organización o cargo, localidad, redes sociales e intereses.\n- Boletín: correo y localidad (opcional).\n- Asistente: las preguntas que escribes, que se procesan para generar la respuesta y no se guardan en una base de datos de la Mesa.\n- Directorio: los datos de contacto de la mesa directiva y de los cabildantes que autorizaron su publicación."}, {"t": "4. Finalidades", "p": "- Recibir, clasificar, asignar y responder iniciativas, alertas y preguntas.\n- Gestionar alianzas, invitaciones, solicitudes de prensa y la vinculación a la red de la Mesa.\n- Enviar el boletín y comunicaciones sobre las actividades de la Mesa, si lo autorizaste.\n- Elaborar informes y estadísticas de gestión sin identificar a las personas.\n- Cumplir obligaciones legales y atender requerimientos de autoridades competentes."}, {"t": "5. Datos de niñas, niños y adolescentes", "p": "La mayoría de los cabildantes son menores de edad. Conforme al artículo 7 de la Ley 1581 de 2012 y a la reglamentación vigente, tratamos sus datos respetando su interés superior y sus derechos prevalentes. Los menores pueden enviar iniciativas con el conocimiento de su madre, padre o acudiente. La publicación de su nombre, imagen o datos de contacto solo se hace con autorización de su representante legal y del propio adolescente, y puede retirarse en cualquier momento."}, {"t": "6. Datos sensibles", "p": "No pedimos datos sensibles (salud, orientación sexual, origen étnico, creencias, afiliaciones políticas). Si los incluyes en un mensaje, por ejemplo al describir una alerta, los trataremos solo para atenderla y con especial reserva. No estás obligado a suministrarlos (artículos 5 y 6 de la Ley 1581 de 2012)."}, {"t": "7. Tus derechos como titular", "p": "Puedes conocer, actualizar y rectificar tus datos; pedir prueba de tu autorización; ser informado del uso que les damos; revocar la autorización o pedir la supresión cuando no se respeten tus derechos; acceder gratuitamente a tus datos, y presentar quejas ante la Superintendencia de Industria y Comercio (artículo 8 de la Ley 1581 de 2012)."}, {"t": "8. Cómo ejercer tus derechos", "p": "Escribe a cabildantesdebogota@gmail.com con el asunto «Datos personales», tu nombre, tu solicitud y un medio de respuesta.\n- Consultas: respondemos en máximo 10 días hábiles, prorrogables por 5 días hábiles más con aviso previo (artículo 14).\n- Reclamos: respondemos en máximo 15 días hábiles, prorrogables por 8 días hábiles más con aviso previo (artículo 15).\n\nSolo puedes acudir a la Superintendencia de Industria y Comercio después de agotar este trámite ante la Mesa."}, {"t": "9. Encargados y transferencias", "p": "Para operar el sitio usamos proveedores que pueden almacenar o procesar datos fuera de Colombia: el servicio de correo electrónico de la Mesa, el proveedor de alojamiento web, el servicio de envío de formularios y, si usas el asistente, el proveedor de inteligencia artificial. Al usar los formularios autorizas esta transmisión, que se hace solo para las finalidades descritas (artículo 26 de la Ley 1581 de 2012)."}, {"t": "10. Seguridad, conservación y vigencia", "p": "Aplicamos medidas razonables de seguridad: conexión cifrada, acceso restringido al correo oficial y entrega de los archivos al final de cada periodo a la mesa entrante. Conservamos los datos mientras sean necesarios para las finalidades y para la memoria institucional de la Mesa. Esta política rige desde su publicación."}], "actualizado": "2026-10-01"}, {"id": "aviso", "titulo": "Aviso de privacidad", "resumen": "La versión corta de cómo tratamos tus datos.", "secciones": [{"t": "Aviso de privacidad", "p": "La Mesa Distrital de Cabildantes Estudiantiles de Bogotá D.C. (MDCE), responsable del tratamiento, recoge los datos que envías por este sitio para recibir y responder iniciativas, gestionar la red de aliados, enviar el boletín y elaborar estadísticas de gestión.\n\nComo titular puedes conocer, actualizar, rectificar y suprimir tus datos, y revocar tu autorización, escribiendo a cabildantesdebogota@gmail.com. No estás obligado a responder preguntas sobre datos sensibles ni sobre datos de niñas, niños y adolescentes.\n\nConsulta la Política de tratamiento de datos personales completa en esta misma sección."}], "actualizado": "2026-10-01"}, {"id": "cookies", "titulo": "Política de cookies y almacenamiento local", "resumen": "Qué guardamos en tu navegador y por qué.", "secciones": [{"t": "1. Qué son", "p": "Las cookies y el almacenamiento local son pequeños archivos o registros que un sitio guarda en tu navegador para recordar información entre visitas."}, {"t": "2. Lo que usamos", "p": "Este sitio no usa cookies de publicidad, de seguimiento ni de analítica. Solo guarda en el almacenamiento local de tu navegador:\n- Tu preferencia de tema (claro u oscuro).\n- Tu decisión sobre este aviso de cookies.\n- Si administras el sitio, el borrador de los cambios que no has publicado.\n\nEstos registros son técnicos y necesarios para que el sitio funcione como esperas. No nos permiten identificarte."}, {"t": "3. Servicios de terceros", "p": "Para mostrar las tipografías, el navegador las descarga desde Google Fonts, que recibe la dirección IP de tu dispositivo. Los formularios y el asistente se comunican con nuestros proveedores de correo, alojamiento e inteligencia artificial solo cuando los usas. Los enlaces a redes sociales y álbumes de fotos llevan a sitios con sus propias políticas."}, {"t": "4. Cómo borrarlos", "p": "Puedes borrar el almacenamiento local desde la configuración de tu navegador, en la sección de privacidad o datos de sitios. Si lo haces, el sitio volverá al tema claro y te mostrará de nuevo el aviso."}], "actualizado": "2026-10-01"}, {"id": "imagen", "titulo": "Uso de imagen de niñas, niños y adolescentes", "resumen": "Cómo publicamos fotos y videos de cabildantes menores de edad.", "secciones": [{"t": "Nuestro compromiso", "p": "La mayoría de los cabildantes son menores de edad. Siguiendo el Código de la Infancia y la Adolescencia (Ley 1098 de 2006), en especial su derecho a la intimidad y a la propia imagen, y el artículo 7 de la Ley 1581 de 2012:\n- Publicamos fotos de actividades institucionales de la Mesa, nunca imágenes que expongan a un menor a burla, discriminación o riesgo.\n- Pedimos autorización de uso de imagen a la madre, padre o acudiente y la opinión del propio estudiante.\n- No publicamos direcciones, documentos de identidad ni ubicación en tiempo real de ningún cabildante.\n- Los datos de contacto de la mesa directiva se publican con autorización de sus titulares para que la ciudadanía pueda comunicarse con la Mesa."}, {"t": "Retiro de fotos o datos", "p": "Si apareces en una foto o en el directorio y quieres que lo retiremos, o eres acudiente de un menor que aparece, escribe a cabildantesdebogota@gmail.com con el asunto «Retiro de imagen». Lo haremos en el menor tiempo posible y a más tardar en 10 días hábiles."}], "actualizado": "2026-10-01"}, {"id": "autor", "titulo": "Derechos de autor y uso de marca", "resumen": "Cómo citar nuestros contenidos y usar los logotipos.", "secciones": [{"t": "Contenidos", "p": "Los textos, fotografías y piezas de este sitio están protegidos por la Ley 23 de 1982 y la Decisión Andina 351 de 1993. Puedes citarlos y compartirlos con fines informativos, educativos o periodísticos indicando «Fuente: Mesa Distrital de Cabildantes Estudiantiles de Bogotá». Para otros usos, escríbenos.\n\nLas fotos tomadas por el Concejo de Bogotá o por terceros conservan los derechos de sus autores."}, {"t": "Logotipos e identidad", "p": "El escudo Sol de 20 localidades, los logotipos y el lema «Veinte localidades, una sola mesa» identifican a la MDCE. Los medios y aliados pueden usarlos para referirse a la Mesa, sin deformarlos, cambiar sus colores ni sugerir respaldo de la Mesa a terceros. Las guías de uso están en la sala de prensa."}, {"t": "Normas citadas", "p": "Las normas y documentos oficiales enlazados son de dominio público y se citan desde sus fuentes oficiales."}], "actualizado": "2026-10-01"}, {"id": "accesibilidad", "titulo": "Declaración de accesibilidad", "resumen": "Nuestro compromiso para que el sitio sirva a todas las personas.", "secciones": [{"t": "Compromiso", "p": "Queremos que todas las personas, incluidas las personas con discapacidad, puedan usar este sitio. Tomamos como referencia la Ley 1346 de 2009, la Ley Estatutaria 1618 de 2013, la NTC 5854 y las pautas WCAG 2.1 nivel AA."}, {"t": "Lo que hicimos", "p": "- Navegación completa con teclado y enlace para saltar al contenido.\n- Textos alternativos en las imágenes y contraste suficiente entre texto y fondo.\n- Diseño adaptable a celulares, tabletas y computadores, y opción de tema oscuro.\n- Respeto por la preferencia de reducir el movimiento del sistema operativo."}, {"t": "Reporta una barrera", "p": "Si encuentras una parte del sitio que no puedes usar, escríbenos a cabildantesdebogota@gmail.com y la corregiremos."}], "actualizado": "2026-10-01"}, {"id": "peticiones", "titulo": "Peticiones, quejas y transparencia", "resumen": "Cómo comunicarte con la Mesa y con las entidades.", "secciones": [{"t": "Comunicaciones con la Mesa", "p": "Puedes escribirnos por el buzón de iniciativas o al correo cabildantesdebogota@gmail.com. Respondemos tan pronto como la comisión responsable revise tu mensaje. La MDCE es una instancia de participación y no una entidad pública, por lo que sus respuestas no son actos administrativos."}, {"t": "Peticiones a las entidades", "p": "Toda persona, incluidos los menores de edad, puede presentar peticiones respetuosas a las autoridades (artículo 23 de la Constitución y Ley 1755 de 2015). Por regla general deben responder en 15 días hábiles; 10 si pides documentos o información, y 30 si es una consulta."}, {"t": "Transparencia", "p": "Siguiendo el espíritu de la Ley 1712 de 2014, publicamos nuestros informes de gestión, el semáforo de respuestas de las entidades, los comunicados y la agenda en la sección de Transparencia."}], "actualizado": "2026-10-01"}, {"id": "ia", "titulo": "Aviso sobre el asistente de inteligencia artificial", "resumen": "Lo que debes saber antes de conversar con el asistente.", "secciones": [{"t": "Qué es", "p": "El asistente de la Mesa es un programa de inteligencia artificial que responde preguntas con base en la información publicada en este sitio. No es una persona ni habla en nombre de la mesa directiva."}, {"t": "Límites", "p": "- Puede equivocarse o dar información desactualizada: verifica en las secciones del sitio.\n- No da asesoría jurídica, médica ni psicológica.\n- No recibe iniciativas ni denuncias: para eso usa el buzón.\n- Ante una emergencia, llama a la Línea 123. Si necesitas apoyo emocional, la Línea 106 atiende a niñas, niños y adolescentes de Bogotá."}, {"t": "Tus datos", "p": "No escribas datos personales tuyos ni de otras personas en el asistente. Tus preguntas se envían al proveedor de inteligencia artificial solo para generar la respuesta. Cuando el asistente no está conectado, responde con las preguntas frecuentes del sitio sin enviar datos a terceros."}], "actualizado": "2026-10-01"}]}</script>
